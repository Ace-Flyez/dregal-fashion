<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Requests | D’REGAL</title><link rel="stylesheet" href="css/style.css"><script defer src="js/compliance.js"></script><script defer src="js/store.js"></script></head><body id="top"><header data-site-header></header><main><section class="page-hero wrap"><p class="eyebrow">Your data</p><h1>Access or<br><em>delete.</em></h1><p>Submit an access, export, correction, or deletion request. We verify ownership before completing a request.</p><form class="legal-form" data-data-request-form><label for="request-email">Email address</label><input id="request-email" name="email" type="email" required placeholder="you@example.com"><label for="request-action">Request type</label><select id="request-action" name="action"><option value="access">Access my data</option><option value="export">Export my data</option><option value="delete">Delete my data</option><option value="correct">Correct my data</option></select><button class="button button--dark" type="submit">Submit request</button><p class="form-note" data-form-note></p></form></section></main><footer data-site-footer></footer><script>document.querySelector('[data-data-request-form]').addEventListener('submit',e=>{e.preventDefault();try{const d=new FormData(e.currentTarget);window.dregalCompliance.requestData(d.get('action'),d.get('email'));e.currentTarget.querySelector('[data-form-note]').textContent='Request recorded for owner review. We aim to respond within 30 days.';}catch(error){e.currentTarget.querySelector('[data-form-note]').textContent=error.message;}});</script></body></html>
