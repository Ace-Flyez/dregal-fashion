<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact | D'REGAL</title>
    <meta
      name="description"
      content="Contact D'REGAL for ready-made and custom-made clothing enquiries."
    />
    <link rel="icon" href="assets/logo/dregal-logo.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="js/products.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <header data-site-header></header>
    <main id="main-content">
      <section class="page-intro">
        <p class="eyebrow">Contact</p>
        <h1>Let’s make it personal.</h1>
        <p>For orders, custom-made clothing and general enquiries, D’REGAL is ready to talk.</p>
      </section>
      <section class="contact-grid">
        <div class="contact-details">
          <div>
            <h2>WhatsApp</h2>
            <p>
              <a href="https://wa.me/2347031605920" target="_blank" rel="noreferrer">
                +234 703 160 5920
              </a>
            </p>
          </div>
          <div>
            <h2>Email</h2>
            <p><a href="mailto:dregal@gmail.com">dregal@gmail.com</a></p>
          </div>
          <div>
            <h2>Instagram</h2>
            <p>
              <a
                href="https://www.instagram.com/dregalcouture?mdxt=MTl4bDUyYzJqYWtnNg=="
                target="_blank"
                rel="noreferrer"
              >
                @dregalcouture
              </a>
            </p>
          </div>
          <div>
            <h2>Based in</h2>
            <p>Lagos and Ibadan, Nigeria</p>
          </div>
        </div>
        <form class="contact-form" data-contact-form>
          <label>
            Your name
            <input name="name" required />
          </label>
          <label>
            Email address
            <input type="email" name="email" required />
          </label>
          <label>
            How can we help?
            <textarea
              name="message"
              required
              placeholder="Tell us about the piece or custom order you have in mind."
            ></textarea>
          </label>
          <button class="button" type="submit">Send via WhatsApp</button>
        </form>
      </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
  </body>
</html>
