<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unsubscribe | D’REGAL</title><link rel="stylesheet" href="css/style.css"><script defer src="js/compliance.js"></script><script defer src="js/store.js"></script></head><body id="top"><header data-site-header></header><main><section class="page-hero wrap"><p class="eyebrow">Your inbox</p><h1>Unsubscribe<br><em>from marketing.</em></h1><p>Enter the email address used for marketing messages. This does not cancel transactional order updates.</p><form class="legal-form" data-unsubscribe-form><label for="unsubscribe-email">Email address</label><input id="unsubscribe-email" name="email" type="email" required placeholder="you@example.com"><button class="button button--dark" type="submit">Unsubscribe</button><p class="form-note" data-form-note></p></form></section></main><footer data-site-footer></footer><script>document.querySelector('[data-unsubscribe-form]').addEventListener('submit',e=>{e.preventDefault();const email=e.currentTarget.email.value.trim();if(!window.dregalCompliance.validateEmail(email))return;e.currentTarget.querySelector('[data-form-note]').textContent='Your request has been recorded. We will suppress marketing messages after verification.';localStorage.setItem('dregal-marketing-unsubscribed',email);});</script></body></html>
